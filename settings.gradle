pluginManagement {
	repositories {
		mavenCentral()
		gradlePluginPortal()
		maven {
			name = 'NeoForged'
			url = 'https://maven.neoforged.net/releases'
		}
	}
}

plugins {
	// lets gradle provision a jdk 21 toolchain on boxes that lack one (ci does)
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'foundry-additions'
